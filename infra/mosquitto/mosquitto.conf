# Broker MQTT interno. Es un bus entre servicios: los cuidadores nunca se conectan aquí.

listener 1883

# Sin autenticación en desarrollo: docker-compose.yml solo publica el puerto en 127.0.0.1.
# Antes de cualquier despliegue real: usuarios por servicio, ACL por tema y TLS.
allow_anonymous true

# Persistencia de sesiones y mensajes retenidos: si un servicio se reinicia, el broker le
# guarda los mensajes QoS 1 pendientes (sesión persistente) y el estado de los incidentes.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
