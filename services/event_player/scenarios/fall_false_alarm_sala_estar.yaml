name: fall_false_alarm_sala_estar
description: >
  Posible caída en la sala de estar; a los 6 s el detector ve que la persona se ha levantado
  y publica una falsa alarma. El incidente deja de escalar, baja a prioridad baja y queda
  pendiente de que un cuidador lo revise.
steps:
  - at_s: 0
    event_type: fall_suspected
    zone_id: sala_estar
    confidence: 0.71
    severity_hint: high
  - at_s: 6
    event_type: fall_dismissed
    zone_id: sala_estar
    confidence: 0.88
    severity_hint: low
    payload:
      reason: person_recovered
