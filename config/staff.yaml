# Personal y turnos.
#
# - Las horas son locales de la residencia (timezone en residence.yaml) y van entre
#   comillas: sin ellas, YAML interpreta "08:00" como un número en base 60.
# - Los turnos deben cubrir las 24 h sin huecos ni solapes (se valida al arrancar).
# - En cada turno, toda zona debe tener al menos un cuidador y debe haber un supervisor.
# - Una zona puede estar asignada a varios cuidadores: todos reciben la primera alerta.
#
# Supuestos de la simulación: dos turnos de 12 h y un supervisor por turno. Los nombres
# son ficticios.

shifts:
  - { id: day, name: Turno de día, start: "08:00", end: "20:00" }
  - { id: night, name: Turno de noche, start: "20:00", end: "08:00" }

staff:
  # --- Turno de día: 3 cuidadores por planta ---
  - id: cuid_d1
    name: Ana
    role: caregiver
    shift: day
    zones: [hab_01, hab_02, hab_03, hab_04]
  - id: cuid_d2
    name: Carlos
    role: caregiver
    shift: day
    zones: [hab_05, hab_06, hab_07, hab_08, pasillo_p0]
  - id: cuid_d3
    name: Elena
    role: caregiver
    shift: day
    zones: [comedor, sala_estar, banos_p0, jardin]
  - id: cuid_d4
    name: David
    role: caregiver
    shift: day
    zones: [hab_11, hab_12, hab_13, hab_14]
  - id: cuid_d5
    name: Marta
    role: caregiver
    shift: day
    zones: [hab_15, hab_16, hab_17, hab_18]
  # Refuerzo de la planta 1: comparte las habitaciones de encamados (los cambios
  # posturales suelen requerir dos personas) y cubre pasillo y baños.
  - id: cuid_d6
    name: Pablo
    role: caregiver
    shift: day
    zones: [hab_14, hab_17, pasillo_p1, banos_p1]
  - id: sup_d
    name: Isabel
    role: supervisor
    shift: day

  # --- Turno de noche: 1 cuidador por planta ---
  - id: cuid_n1
    name: Sara
    role: caregiver
    shift: night
    zones: [hab_01, hab_02, hab_03, hab_04, hab_05, hab_06, hab_07, hab_08,
            pasillo_p0, comedor, sala_estar, banos_p0, jardin]
  - id: cuid_n2
    name: Luis
    role: caregiver
    shift: night
    zones: [hab_11, hab_12, hab_13, hab_14, hab_15, hab_16, hab_17, hab_18,
            pasillo_p1, banos_p1]
  - id: sup_n
    name: Miguel
    role: supervisor
    shift: night
